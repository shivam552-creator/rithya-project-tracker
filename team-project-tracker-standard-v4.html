<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>Team Project Tracker</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="shell" title="Project Tracker"></iframe>
<script>
(function(){'use strict';
var q=new URLSearchParams(location.search),T=(q.get('access')||'').trim();
var U='https://blsbezkugmentlgnsmwq.supabase.co',K='sb_publishable_mEjNb7XSZT1tmC4a93to7w_PaYiNCYO';
var PROOF_URL=U+'/functions/v1/daily-task-proof';
var shell=document.getElementById('shell'),projects=[],projectBriefs=[],dailyTasks=[],busy=false;
var reportSubmitted=false,reportChecking=false,reportCheckedAt=0;
var briefLoading=false,briefLoadedAt=0,dailyLoading=false,dailyLoadedAt=0;
q.set('v','20260831-daily-tasks-v6');
shell.src='team-project-tracker-standard-v3.html?'+q.toString()+location.hash;
function rpc(n,a){return fetch(U+'/rest/v1/rpc/'+n,{method:'POST',cache:'no-store',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify(a||{})}).then(function(r){return r.text().then(function(t){var d=null;if(t){try{d=JSON.parse(t)}catch(_){d=t}}if(!r.ok)throw new Error(d&&d.message?d.message:'Request failed');return d})})}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function coreDoc(){try{var d1=shell.contentDocument;if(!d1)return null;var inner=d1.getElementById('tracker');return inner&&inner.contentDocument?inner.contentDocument:null}catch(_){return null}}
function loadProjects(){if(!T)return Promise.resolve();return rpc('tracker_projects',{p_token:T}).then(function(r){projects=r||[]}).catch(function(){})}
function loadBriefs(force){if(!T||briefLoading)return Promise.resolve();if(!force&&Date.now()-briefLoadedAt<10000)return Promise.resolve();briefLoading=true;return rpc('tracker_project_descriptions',{p_token:T}).then(function(r){projectBriefs=r||[];briefLoadedAt=Date.now()}).catch(function(){}).finally(function(){briefLoading=false})}
function loadDailyTasks(force){if(!T||dailyLoading)return Promise.resolve();if(!force&&Date.now()-dailyLoadedAt<8000)return Promise.resolve();dailyLoading=true;return rpc('tracker_daily_tasks',{p_token:T,p_work_date:null}).then(function(r){dailyTasks=r||[];dailyLoadedAt=Date.now();var d=coreDoc();if(d)renderDailyTasks(d)}).catch(function(err){var d=coreDoc(),m=d&&d.getElementById('dailyTaskMsgV6');if(m)m.textContent=err.message||String(err)}).finally(function(){dailyLoading=false})}
function findProject(name){name=String(name||'').trim();return projects.find(function(p){return p.status==='Done'&&String(p.task||'').trim()===name})||null}
function findBrief(name){name=String(name||'').trim();var x=projectBriefs.find(function(p){return String(p.task||'').trim()===name});return x&&x.description?String(x.description):''}
function refreshCore(){var d=coreDoc();if(!d)return;var b=d.getElementById('refreshBtn');if(b)b.click();setTimeout(function(){Promise.all([loadProjects(),loadBriefs(true),loadDailyTasks(true)]).then(patch)},500)}
function reopen(p,btn){if(!p||busy)return;var ok=confirm('Bring this project back to Current Projects?\n\nIts completion will be reversed, the last completed task will reopen when tasks exist, and the score will recalculate with a small rework deduction.');if(!ok)return;busy=true;btn.disabled=true;btn.textContent='Reopening...';rpc('tracker_reopen_project',{p_token:T,p_id:Number(p.id),p_reason:'Completion reversed by team member; more work is needed'}).then(function(){refreshCore()}).catch(function(err){alert(err.message||String(err));btn.disabled=false;btn.textContent='↩ Reopen'}).finally(function(){busy=false})}
function patchReportUi(){var d=coreDoc();if(!d)return;var b=d.getElementById('generateBtn'),msg=d.getElementById('dailyMsg');if(!b)return;
  if(reportSubmitted){b.disabled=true;b.textContent='Report submitted ✓';b.title='Today\'s report is already submitted. Only one Daily Report is allowed per day.';if(msg)msg.textContent='Today\'s report is already submitted. Only one Daily Report is allowed per day.';}
  else{if(b.textContent==='Report submitted ✓'){b.disabled=false;b.textContent='Generate Report';b.title='';}}
  if(!b.__oneReportGuard){b.__oneReportGuard=true;b.addEventListener('click',function(){setTimeout(function(){checkReportStatus(true);loadDailyTasks(true)},900)},true)}
}
function checkReportStatus(force){if(!T||reportChecking)return Promise.resolve();if(!force&&Date.now()-reportCheckedAt<8000){patchReportUi();return Promise.resolve();}reportChecking=true;return rpc('tracker_daily_workspace',{p_token:T,p_work_date:null}).then(function(r){var x=(r||[])[0]||{};reportSubmitted=!!x.report_generated_at;reportCheckedAt=Date.now();patchReportUi()}).catch(function(){}).finally(function(){reportChecking=false})}
function ensureBriefStyles(d){if(d.getElementById('projectBriefStylesV5'))return;var s=d.createElement('style');s.id='projectBriefStylesV5';s.textContent='#projectBriefBoxV5{margin:14px 0 10px;padding:13px 14px;border:1px solid #cfd4dc;border-left:4px solid #344054;border-radius:8px;background:#f8f9fb}#projectBriefBoxV5 .pbLabel{font-size:11px;font-weight:700;letter-spacing:.06em;color:#667085;margin-bottom:7px}#projectBriefBoxV5 .pbText{font-size:13px;line-height:1.6;white-space:pre-line;color:#344054}#projectBriefBoxV5 .pbHint{margin-top:9px;padding-top:8px;border-top:1px solid #e4e7ec;font-size:11px;color:#667085}';d.head.appendChild(s)}
function patchProjectBrief(d){ensureBriefStyles(d);var title=d.getElementById('taskProjectTitle'),modal=d.getElementById('taskModal');if(!title||!modal)return;var name=String(title.textContent||'').trim();var brief=findBrief(name);var box=d.getElementById('projectBriefBoxV5');if(!box){box=d.createElement('div');box.id='projectBriefBoxV5';var summary=modal.querySelector('.summary');if(summary&&summary.parentNode)summary.parentNode.insertBefore(box,summary)}box.innerHTML='';var label=d.createElement('div');label.className='pbLabel';label.textContent='PROJECT BRIEF';var text=d.createElement('div');text.className='pbText';text.textContent=brief||'This project does not have a detailed brief yet. Use the measurable project title and the tasks below as the current execution plan.';var hint=d.createElement('div');hint.className='pbHint';hint.textContent='The tasks below are the execution steps. Tick a task only when that step is fully completed; the project is successful only when its measurable output is achieved.';box.appendChild(label);box.appendChild(text);box.appendChild(hint);
var notes=d.querySelectorAll('#currentView .workspace .note');notes.forEach(function(n){if(String(n.textContent||'').indexOf('Click a project name')>=0)n.textContent='Click a project name to see the Project Brief, success target and execution tasks. Use Edit for project name and due date.'});}
function ensureDailyStyles(d){if(d.getElementById('dailyTaskStylesV6'))return;var s=d.createElement('style');s.id='dailyTaskStylesV6';s.textContent='\
#dailyTasksV6 .dtHead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid #cfd4dc;border-left:5px solid #175cd3;background:#f7f8fa;border-radius:7px;padding:13px 15px;margin-bottom:12px}\
#dailyTasksV6 .dtHead h2{font-size:17px;margin:2px 0 4px}\
#dailyTasksV6 .dtSummary{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}\
#dailyTasksV6 .dtChip{border:1px solid #d9dce1;border-radius:999px;padding:6px 9px;font-size:12px;background:#fff}\
#dailyTasksV6 table{min-width:1120px}\
#dailyTasksV6 textarea{width:100%;min-height:58px;border:1px solid #e1e4e8;border-radius:4px;padding:7px 8px;resize:vertical}\
#dailyTasksV6 .dtProof{min-width:210px}.dtFileNameV6{font-size:11px;color:#667085;margin-top:5px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\
#dailyTasksV6 .dtActions{display:flex;gap:5px;flex-wrap:wrap}.dtTouchedV6{font-size:10px;color:#176c3a;margin-top:4px}.dtUntouchedV6{font-size:10px;color:#b54708;margin-top:4px}\
#dailyTaskModalV6 .modal{max-width:620px}.dtScoreNoteV6{margin-top:10px;padding:10px 12px;border:1px solid #e0e3e8;border-radius:7px;background:#fafafa;font-size:12px;color:#667085;line-height:1.5}\
@media(max-width:650px){#dailyTasksV6 .dtHead{align-items:flex-start}}';d.head.appendChild(s)}
function ensureDailyUi(d){ensureDailyStyles(d);var tab=d.querySelector('.tab[data-tab="future"]'),view=d.getElementById('futureView');if(tab)tab.textContent='Daily Tasks';if(!view)return;
  if(!d.getElementById('dailyTasksV6')){
    view.innerHTML='<div id="dailyTasksV6"><div class="dtHead"><div><div class="note">DAILY EXECUTION</div><h2>Daily Tasks</h2><div class="note">Standing daily work resets to To do each day. Update the status, add a short note and attach proof when useful.</div></div><button id="dailyTaskAddV6" class="primary">+ Add Task</button></div><div id="dailyTaskSummaryV6" class="dtSummary"></div><div id="dailyTaskMsgV6" class="statusmsg">Ready</div><div class="tablewrap"><table><thead><tr><th>TASK</th><th>STATUS</th><th>NOTES</th><th>PROOF LINK</th><th>PROOF FILE</th><th>ACTIONS</th></tr></thead><tbody id="dailyTaskRowsV6"></tbody></table></div><div class="dtScoreNoteV6"><b>Scoring:</b> Daily Tasks are part of the daily work evidence. Real updates, completion, notes and proof help show the work done. Repeated tasks left untouched, together with no meaningful project movement, can reduce the daily performance score. A genuine off day is not treated as a work failure.</div><div id="futureRows" style="display:none"></div></div>';
    var m=d.createElement('div');m.id='dailyTaskModalV6';m.className='modalback hide';m.innerHTML='<div class="modal"><h3 id="dailyTaskModalTitleV6">Add Daily Task</h3><div class="field"><label>Task</label><input id="dailyTaskTitleV6" placeholder="Example: Update received payments in Zoho Books"></div><div class="field"><label>Task note / instruction (optional)</label><input id="dailyTaskNotesV6" placeholder="Short standing instruction for this daily task"></div><div id="dailyTaskModalErrV6" class="err"></div><div class="modalactions"><button id="dailyTaskCancelV6">Cancel</button><button id="dailyTaskSaveV6" class="primary">Save Task</button></div></div>';d.body.appendChild(m);
    d.getElementById('dailyTaskAddV6').onclick=function(){openDailyTaskEditor(d,null)};
    d.getElementById('dailyTaskCancelV6').onclick=function(){m.classList.add('hide');m.dataset.editId=''};
    m.onclick=function(ev){if(ev.target===m)d.getElementById('dailyTaskCancelV6').click()};
    d.getElementById('dailyTaskSaveV6').onclick=function(){saveDailyTaskDefinition(d)};
  }
  var addWhen=d.getElementById('addWhen');if(addWhen){addWhen.value='now';var af=addWhen.closest('.field');if(af)af.style.display='none'}
  var editWhen=d.getElementById('editWhen');if(editWhen){editWhen.value='now';var ef=editWhen.closest('.field');if(ef)ef.style.display='none'}
  var dailyHead=d.querySelector('.dailyhead .note');if(dailyHead)dailyHead.textContent='Project movement and Daily Tasks are captured automatically. Use this box only for other work that is not already recorded.';
}
function renderDailyTasks(d){ensureDailyUi(d);var body=d.getElementById('dailyTaskRowsV6'),sum=d.getElementById('dailyTaskSummaryV6');if(!body||!sum)return;var total=dailyTasks.length,done=dailyTasks.filter(function(x){return x.status==='Done'}).length,ip=dailyTasks.filter(function(x){return x.status==='In progress'}).length,bl=dailyTasks.filter(function(x){return x.status==='Blocked'}).length,todo=dailyTasks.filter(function(x){return x.status==='To do'}).length,touched=dailyTasks.filter(function(x){return !!x.employee_touched_at}).length;
  sum.innerHTML='<span class="dtChip"><b>'+done+'</b> Done</span><span class="dtChip"><b>'+ip+'</b> In progress</span><span class="dtChip"><b>'+bl+'</b> Blocked</span><span class="dtChip"><b>'+todo+'</b> To do</span><span class="dtChip"><b>'+touched+' / '+total+'</b> touched today</span>';
  if(!total){body.innerHTML='<tr><td colspan="6" class="empty">No Daily Tasks yet. Add the repeated daily work that should be visible and accountable.</td></tr>';return;}
  body.innerHTML=dailyTasks.map(function(x){var id=Number(x.log_id),def=Number(x.definition_id);return '<tr class="'+(x.status==='Done'?'done':x.status==='Blocked'?'blocked':'')+'"><td><b>'+esc(x.title)+'</b>'+(x.task_notes?'<div class="note" style="margin-top:4px">'+esc(x.task_notes)+'</div>':'')+(x.employee_touched_at?'<div class="dtTouchedV6">Updated today</div>':'<div class="dtUntouchedV6">Not updated yet today</div>')+'</td><td><select class="gridselect dtStatusV6" data-id="'+id+'"><option'+(x.status==='To do'?' selected':'')+'>To do</option><option'+(x.status==='In progress'?' selected':'')+'>In progress</option><option'+(x.status==='Blocked'?' selected':'')+'>Blocked</option><option'+(x.status==='Done'?' selected':'')+'>Done</option></select></td><td><textarea class="dtNotesV6" data-id="'+id+'" placeholder="What was done / issue / result">'+esc(x.notes||'')+'</textarea></td><td><input class="gridinput dtLinkV6" data-id="'+id+'" value="'+esc(x.proof_link||'')+'" placeholder="https://..."></td><td class="dtProof"><input type="file" class="dtFileV6" data-id="'+id+'"><div class="dtFileNameV6">'+(x.has_file?esc(x.proof_file_name||'Proof attached'):'No file attached')+'</div>'+(x.has_file?'<button class="small dtViewFileV6" data-id="'+id+'" style="margin-top:5px">View file</button>':'')+'</td><td><div class="dtActions"><button class="small primary dtSaveV6" data-id="'+id+'">Save</button><button class="small dtUploadV6" data-id="'+id+'">Upload file</button><button class="small dtEditV6" data-def="'+def+'">Edit task</button><button class="small danger dtDeleteV6" data-def="'+def+'">Delete</button></div></td></tr>'}).join('');
  body.querySelectorAll('.dtSaveV6').forEach(function(b){b.onclick=function(){saveDailyTaskRow(d,Number(this.dataset.id),this)}});
  body.querySelectorAll('.dtUploadV6').forEach(function(b){b.onclick=function(){uploadDailyProof(d,Number(this.dataset.id),this)}});
  body.querySelectorAll('.dtEditV6').forEach(function(b){b.onclick=function(){var def=Number(this.dataset.def),row=dailyTasks.find(function(x){return Number(x.definition_id)===def});openDailyTaskEditor(d,row||null)}});
  body.querySelectorAll('.dtDeleteV6').forEach(function(b){b.onclick=function(){deleteDailyTask(d,Number(this.dataset.def))}});
  body.querySelectorAll('.dtViewFileV6').forEach(function(b){b.onclick=function(){viewDailyProof(d,Number(this.dataset.id),this)}});
}
function openDailyTaskEditor(d,row){var m=d.getElementById('dailyTaskModalV6');if(!m)return;m.dataset.editId=row?String(row.definition_id):'';d.getElementById('dailyTaskModalTitleV6').textContent=row?'Edit Daily Task':'Add Daily Task';d.getElementById('dailyTaskTitleV6').value=row?row.title:'';d.getElementById('dailyTaskNotesV6').value=row?(row.task_notes||''):'';d.getElementById('dailyTaskModalErrV6').textContent='';m.classList.remove('hide');setTimeout(function(){d.getElementById('dailyTaskTitleV6').focus()},50)}
function saveDailyTaskDefinition(d){var m=d.getElementById('dailyTaskModalV6'),title=d.getElementById('dailyTaskTitleV6').value.trim(),notes=d.getElementById('dailyTaskNotesV6').value.trim(),err=d.getElementById('dailyTaskModalErrV6'),btn=d.getElementById('dailyTaskSaveV6'),editId=Number(m.dataset.editId||0);if(!title){err.textContent='Please enter the task.';return}btn.disabled=true;err.textContent='Saving...';var p=editId?rpc('tracker_edit_daily_task',{p_token:T,p_definition_id:editId,p_title:title,p_task_notes:notes||null}):rpc('tracker_add_daily_task',{p_token:T,p_title:title,p_task_notes:notes||null,p_work_date:null});p.then(function(){m.classList.add('hide');m.dataset.editId='';dailyLoadedAt=0;return loadDailyTasks(true)}).catch(function(e){err.textContent=e.message||String(e)}).finally(function(){btn.disabled=false})}
function saveDailyTaskRow(d,id,btn){var st=d.querySelector('.dtStatusV6[data-id="'+id+'"]'),nt=d.querySelector('.dtNotesV6[data-id="'+id+'"]'),ln=d.querySelector('.dtLinkV6[data-id="'+id+'"]'),msg=d.getElementById('dailyTaskMsgV6');btn.disabled=true;msg.textContent='Saving Daily Task...';rpc('tracker_update_daily_task',{p_token:T,p_log_id:id,p_status:st.value,p_notes:nt.value||null,p_proof_link:ln.value||null}).then(function(){msg.textContent='Saved.';dailyLoadedAt=0;return loadDailyTasks(true)}).catch(function(e){msg.textContent=e.message||String(e)}).finally(function(){btn.disabled=false})}
function deleteDailyTask(d,defId){if(!confirm('Delete this Daily Task? It will stop appearing from today onward. Past activity remains saved for history.'))return;var msg=d.getElementById('dailyTaskMsgV6');msg.textContent='Deleting...';rpc('tracker_delete_daily_task',{p_token:T,p_definition_id:defId}).then(function(){msg.textContent='Deleted.';dailyLoadedAt=0;return loadDailyTasks(true)}).catch(function(e){msg.textContent=e.message||String(e)})}
function uploadDailyProof(d,id,btn){var input=d.querySelector('.dtFileV6[data-id="'+id+'"]'),msg=d.getElementById('dailyTaskMsgV6'),file=input&&input.files&&input.files[0];if(!file){msg.textContent='Choose a proof file first.';return}if(file.size>25*1024*1024){msg.textContent='Maximum proof file size is 25 MB.';return}var fd=new FormData();fd.append('token',T);fd.append('log_id',String(id));fd.append('action','upload');fd.append('file',file,file.name);btn.disabled=true;msg.textContent='Uploading proof...';fetch(PROOF_URL,{method:'POST',body:fd}).then(function(r){return r.json().then(function(x){if(!r.ok)throw new Error(x.error||'Upload failed');return x})}).then(function(){msg.textContent='Proof uploaded.';dailyLoadedAt=0;return loadDailyTasks(true)}).catch(function(e){msg.textContent=e.message||String(e)}).finally(function(){btn.disabled=false})}
function viewDailyProof(d,id,btn){var msg=d.getElementById('dailyTaskMsgV6'),w=window.open('about:blank','_blank');btn.disabled=true;msg.textContent='Opening proof...';fetch(PROOF_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:T,log_id:id,action:'sign'})}).then(function(r){return r.json().then(function(x){if(!r.ok)throw new Error(x.error||'Could not open proof');return x})}).then(function(x){if(w)w.location=x.url;else window.open(x.url,'_blank');msg.textContent='Proof opened.'}).catch(function(e){if(w)w.close();msg.textContent=e.message||String(e)}).finally(function(){btn.disabled=false})}
function patch(){var d=coreDoc();if(!d)return;try{
  ensureDailyUi(d);patchReportUi();patchProjectBrief(d);renderDailyTasks(d);
  var body=d.getElementById('completedRows');if(!body)return;
  var table=body.closest('table');if(table){var hr=table.querySelector('thead tr');if(hr&&!hr.querySelector('.reopenHead')){var th=d.createElement('th');th.className='reopenHead';th.textContent='ACTION';hr.appendChild(th)}}
  body.querySelectorAll('tr').forEach(function(row){
    var cells=row.querySelectorAll('td');if(!cells.length)return;
    if(cells.length===1&&cells[0].classList.contains('empty')){cells[0].setAttribute('colspan','6');return}
    var name=cells[0].textContent.trim(),p=findProject(name);
    var existing=row.querySelector('.reopenCell');if(existing){if(!p)existing.innerHTML='';return}
    var td=d.createElement('td');td.className='reopenCell';
    if(p){var b=d.createElement('button');b.type='button';b.className='small';b.textContent='↩ Reopen';b.title='Move back to Current Projects';b.onclick=function(){reopen(p,b)};td.appendChild(b)}
    row.appendChild(td);
  });
}catch(_){} }
shell.addEventListener('load',function(){setTimeout(function(){Promise.all([loadProjects(),loadBriefs(true),loadDailyTasks(true)]).then(function(){patch();checkReportStatus(true)})},800);setTimeout(patch,1700)});
setInterval(function(){loadProjects().then(patch);loadBriefs(false).then(patch);loadDailyTasks(false).then(patch);checkReportStatus(false)},2000);
})();
</script>
</body></html>
