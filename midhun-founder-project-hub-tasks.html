<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Midhun Founder Project Hub</title>
<style>
html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif}#hub{width:100%;height:100vh;border:0;display:block}.back{position:fixed;inset:0;background:rgba(0,0,0,.38);display:flex;align-items:center;justify-content:center;padding:18px;z-index:9999}.hide{display:none!important}.modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:10px;border:1px solid #d9dce1;box-shadow:0 20px 60px rgba(0,0,0,.18);padding:18px;box-sizing:border-box}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.head h2{font-size:20px;margin:0}.sub{font-size:12px;color:#667085;margin-top:5px}.x{border:1px solid #d9dce1;background:#fff;border-radius:6px;padding:6px 9px;cursor:pointer}.summary{border:1px solid #d9dce1;background:#fafafa;border-radius:8px;padding:12px;margin:14px 0}.sumtop{display:flex;justify-content:space-between;gap:12px;align-items:center}.big{font-size:21px;font-weight:700}.hint{font-size:11px;color:#667085;margin-top:4px}.bar{height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:8px}.fill{height:100%;background:#344054}.note{border:1px solid #b8c8df;background:#eff6ff;color:#334e75;border-radius:6px;padding:9px 10px;font-size:11px;margin-bottom:12px}.add{display:grid;grid-template-columns:1fr 155px auto;gap:8px;margin:12px 0}.add input{border:1px solid #d9dce1;border-radius:6px;padding:9px;font:inherit}.btn{border:1px solid #d9dce1;background:#fff;border-radius:6px;padding:8px 11px;cursor:pointer;font:inherit}.primary{background:#202833;color:#fff;border-color:#202833}.danger{color:#b42318;border-color:#efb5ae}.tasks{border:1px solid #d9dce1;border-radius:8px;overflow:hidden}.row{display:grid;grid-template-columns:28px 1fr 110px auto;gap:8px;align-items:center;padding:10px 11px;border-bottom:1px solid #eceef1}.row:last-child{border-bottom:0}.row.done .name{text-decoration:line-through;color:#667085}.check{width:18px;height:18px}.name{font-weight:600;font-size:14px}.due{font-size:11px;color:#667085}.empty{text-align:center;color:#667085;padding:24px}.err{font-size:12px;color:#b42318;min-height:18px}.foot{display:flex;justify-content:flex-end;margin-top:14px}@media(max-width:650px){.add{grid-template-columns:1fr}.row{grid-template-columns:28px 1fr auto}.due{grid-column:2}.modal{padding:14px}}
</style>
</head>
<body>
<iframe id="hub"></iframe>
<div id="taskBack" class="back hide"><div class="modal"><div class="head"><div><h2 id="projectTitle">Project Tasks</h2><div id="projectSub" class="sub">Task checklist</div></div><button id="closeX" class="x">×</button></div><div class="summary"><div class="sumtop"><div><div id="pct" class="big">0%</div><div id="summaryText" class="hint">No tasks yet</div></div><div id="fraction" class="big">0 / 0</div></div><div class="bar"><div id="fill" class="fill" style="width:0%"></div></div><div id="weight" class="hint"></div></div><div class="note">Tick a task only when it is fully completed. Project progress is calculated automatically from completed tasks ÷ total tasks.</div><div class="add"><input id="taskTitle" placeholder="Add a task..."><input id="taskDue" type="date"><button id="addBtn" class="btn primary">+ Add Task</button></div><div id="err" class="err"></div><div id="tasks" class="tasks"></div><div class="foot"><button id="closeBtn" class="btn">Close</button></div></div></div>
<script>
(function(){'use strict';
var U='https://blsbezkugmentlgnsmwq.supabase.co',K='sb_publishable_mEjNb7XSZT1tmC4a93to7w_PaYiNCYO';
var qs=new URLSearchParams(location.search),T=(qs.get('access')||'').trim(),PID=null,PTITLE='',TASKS=[];
function e(x){return document.getElementById(x)}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function rpc(n,a){return fetch(U+'/rest/v1/rpc/'+n,{method:'POST',cache:'no-store',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify(a||{})}).then(function(r){return r.text().then(function(t){var d=null;if(t){try{d=JSON.parse(t)}catch(_){d=t}}if(!r.ok)throw new Error(d&&d.message?d.message:'Request failed');return d})})}
function fd(v){if(!v)return'No due date';return'Due '+new Date(v+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}
function refreshHub(){try{var d=e('hub').contentWindow.document,b=d.getElementById('refreshBtn');if(b)b.click()}catch(_){}}
function enhance(){var f=e('hub');try{var d=f.contentWindow.document;if(!d||!d.body)return;var s=d.getElementById('taskEnhanceStyle');if(!s){s=d.createElement('style');s.id='taskEnhanceStyle';s.textContent='.project.taskClickable{cursor:pointer;color:#175cd3}.project.taskClickable:hover{text-decoration:underline}';d.head.appendChild(s)}d.querySelectorAll('tbody tr').forEach(function(r){var edit=r.querySelector('button.edit[data-id]'),p=r.querySelector('.project');if(!edit||!p||p.dataset.taskReady)return;p.dataset.taskReady='1';p.classList.add('taskClickable');p.title='Open project tasks';p.addEventListener('click',function(){openTasks(Number(edit.dataset.id),p.textContent.trim())})})}catch(_){}}
function watchFrame(){enhance();try{var d=e('hub').contentWindow.document;new MutationObserver(enhance).observe(d.body,{childList:true,subtree:true})}catch(_){}setInterval(enhance,1200)}
function openTasks(id,title){PID=id;PTITLE=title;e('projectTitle').textContent=title;e('projectSub').textContent='Task checklist · progress updates automatically';e('taskTitle').value='';e('taskDue').value='';e('err').textContent='';e('taskBack').classList.remove('hide');loadTasks()}
function close(){e('taskBack').classList.add('hide');PID=null;TASKS=[];refreshHub()}
function loadTasks(){if(!PID)return;e('tasks').innerHTML='<div class="empty">Loading tasks...</div>';rpc('founder_project_hub_tasks',{p_token:T,p_project_id:PID}).then(function(r){TASKS=r||[];render()}).catch(function(x){e('err').textContent=x.message||String(x);e('tasks').innerHTML='<div class="empty">Could not load tasks.</div>'})}
function render(){var total=TASKS.length,done=TASKS.filter(function(t){return t.status==='Done'}).length,p=total?Math.round(done*100/total):0;e('pct').textContent=p+'%';e('fraction').textContent=done+' / '+total;e('summaryText').textContent=total?done+' completed out of '+total:'No tasks yet';e('fill').style.width=p+'%';e('weight').textContent=total?'Each task is worth about '+(100/total).toFixed((total===10||total===20)?0:1)+'% of this project.':'Add the first task to start automatic progress.';if(!total){e('tasks').innerHTML='<div class="empty">No tasks yet. Add the first task above.</div>';return}e('tasks').innerHTML=TASKS.map(function(t){var d=t.status==='Done';return'<div class="row '+(d?'done':'')+'"><input class="check tc" type="checkbox" data-id="'+t.id+'" '+(d?'checked':'')+'><div class="name">'+esc(t.title)+'</div><div class="due">'+esc(fd(t.due_date))+'</div><button class="btn danger td" data-id="'+t.id+'">Delete</button></div>'}).join('');document.querySelectorAll('.tc').forEach(function(c){c.onchange=function(){toggle(Number(this.dataset.id),this.checked,this)}});document.querySelectorAll('.td').forEach(function(b){b.onclick=function(){del(Number(this.dataset.id))}})}
function add(){var t=e('taskTitle').value.trim();if(!t){e('err').textContent='Enter a task name.';return}e('addBtn').disabled=true;e('err').textContent='';rpc('founder_project_hub_add_task',{p_token:T,p_project_id:PID,p_title:t,p_due_date:e('taskDue').value||null,p_description:null,p_notes:null}).then(function(){e('taskTitle').value='';e('taskDue').value='';refreshHub();loadTasks()}).catch(function(x){e('err').textContent=x.message||String(x)}).finally(function(){e('addBtn').disabled=false})}
function toggle(id,done,box){box.disabled=true;e('err').textContent='';rpc('founder_project_hub_set_task_done',{p_token:T,p_id:id,p_done:done}).then(function(){refreshHub();loadTasks()}).catch(function(x){box.checked=!done;e('err').textContent=x.message||String(x)}).finally(function(){box.disabled=false})}
function del(id){var t=TASKS.find(function(x){return Number(x.id)===id});if(!t||!confirm('Delete task "'+t.title+'"?'))return;rpc('founder_project_hub_delete_task',{p_token:T,p_id:id}).then(function(){refreshHub();loadTasks()}).catch(function(x){e('err').textContent=x.message||String(x)})}
if(!T){document.body.innerHTML='<div style="padding:30px;font-family:Arial">Founder link is incomplete.</div>';return}
e('hub').src='midhun-founder-project-hub.html?access='+encodeURIComponent(T)+'&v=20260823-task';e('hub').addEventListener('load',watchFrame);e('addBtn').onclick=add;e('closeX').onclick=close;e('closeBtn').onclick=close;e('taskTitle').addEventListener('keydown',function(ev){if(ev.key==='Enter'){ev.preventDefault();add()}});
})();
</script>
</body></html>
