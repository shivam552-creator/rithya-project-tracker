<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team Project Tracker</title>
<style>
html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif;background:#fff}#tracker{width:100%;height:100vh;border:0;display:block}.back{position:fixed;inset:0;background:rgba(0,0,0,.38);display:flex;align-items:center;justify-content:center;padding:18px;z-index:9999}.hide{display:none!important}.modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:10px;border:1px solid #d9dce1;box-shadow:0 20px 60px rgba(0,0,0,.18);padding:18px;box-sizing:border-box}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.head h2{font-size:20px;margin:0}.sub{font-size:12px;color:#667085;margin-top:5px}.x,.btn{border:1px solid #d9dce1;background:#fff;border-radius:6px;padding:8px 11px;cursor:pointer;font:inherit}.x{padding:6px 9px}.primary{background:#202833;color:#fff;border-color:#202833}.danger{color:#b42318;border-color:#efb5ae}.summary{border:1px solid #d9dce1;background:#fafafa;border-radius:8px;padding:12px;margin:14px 0}.sumtop{display:flex;justify-content:space-between;gap:12px;align-items:center}.big{font-size:21px;font-weight:700}.hint{font-size:11px;color:#667085;margin-top:4px}.bar{height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:8px}.fill{height:100%;background:#344054}.note{border:1px solid #b8c8df;background:#eff6ff;color:#334e75;border-radius:6px;padding:9px 10px;font-size:11px;margin-bottom:12px}.add{display:grid;grid-template-columns:1fr 155px auto;gap:8px;margin:12px 0}.add input{border:1px solid #d9dce1;border-radius:6px;padding:9px;font:inherit}.tasks{border:1px solid #d9dce1;border-radius:8px;overflow:hidden}.row{display:grid;grid-template-columns:28px 1fr 110px auto;gap:8px;align-items:center;padding:10px 11px;border-bottom:1px solid #eceef1}.row:last-child{border-bottom:0}.row.done .name{text-decoration:line-through;color:#667085}.check{width:18px;height:18px}.name{font-weight:600;font-size:14px}.due{font-size:11px;color:#667085}.empty{text-align:center;color:#667085;padding:24px}.err{font-size:12px;color:#b42318;min-height:18px}.foot{display:flex;justify-content:flex-end;margin-top:14px}.fatal{padding:30px;font-family:Arial;color:#b42318}@media(max-width:650px){.add{grid-template-columns:1fr}.row{grid-template-columns:28px 1fr auto}.due{grid-column:2}.modal{padding:14px}}
</style>
</head>
<body>
<iframe id="tracker"></iframe>
<div id="taskBack" class="back hide"><div class="modal"><div class="head"><div><h2 id="projectTitle">Project Tasks</h2><div id="projectSub" class="sub">Task checklist · progress updates automatically</div></div><button id="closeX" class="x">×</button></div><div class="summary"><div class="sumtop"><div><div id="pct" class="big">0%</div><div id="summaryText" class="hint">No tasks yet</div></div><div id="fraction" class="big">0 / 0</div></div><div class="bar"><div id="fill" class="fill" style="width:0%"></div></div><div id="weight" class="hint"></div></div><div class="note">Tick a task only when it is fully completed. Project progress is calculated automatically from completed tasks ÷ total tasks.</div><div class="add"><input id="taskTitle" placeholder="Add a task..."><input id="taskDue" type="date"><button id="addBtn" class="btn primary">+ Add Task</button></div><div id="err" class="err"></div><div id="tasks" class="tasks"></div><div class="foot"><button id="closeBtn" class="btn">Close</button></div></div></div>
<script>
(function(){'use strict';
var U='https://blsbezkugmentlgnsmwq.supabase.co',K='sb_publishable_mEjNb7XSZT1tmC4a93to7w_PaYiNCYO';
var q=new URLSearchParams(location.search),T=(q.get('access')||'').trim(),PERSON=(q.get('person')||'').trim().toLowerCase();
var MAP={vivek:'vivek-final-v2.html',redhin:'redhin-project-tracker.html',avantika:'avantika-project-tracker.html',katyayini:'katyayini-project-tracker.html',akash:'akash-tech-project-tracker.html'};
var PID=null,TASKS=[],PROJECTS=[],OWNER='';
function e(x){return document.getElementById(x)}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function rpc(n,a){return fetch(U+'/rest/v1/rpc/'+n,{method:'POST',cache:'no-store',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify(a||{})}).then(function(r){return r.text().then(function(t){var d=null;if(t){try{d=JSON.parse(t)}catch(_){d=t}}if(!r.ok)throw new Error(d&&d.message?d.message:'Request failed');return d})})}
function fd(v){if(!v)return'No due date';return'Due '+new Date(v+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}
function fatal(msg){document.body.innerHTML='<div class="fatal">'+esc(msg)+'</div>'}
function loadProjectMap(){return rpc('tracker_projects',{p_token:T}).then(function(r){PROJECTS=r||[];return PROJECTS})}
function textFromCell(td){if(!td)return'';var inp=td.querySelector('input,textarea');if(inp&&inp.value)return inp.value.trim();var sel=td.querySelector('select');if(sel&&sel.value)return sel.value.trim();var clone=td.cloneNode(true);clone.querySelectorAll('.taskLaunch').forEach(function(x){x.remove()});return clone.textContent.trim()}
function projectForRow(row,tbodyId){var any=row.querySelector('[data-id]');if(any&&/^\d+$/.test(String(any.dataset.id||''))){var byId=PROJECTS.find(function(p){return Number(p.id)===Number(any.dataset.id)});if(byId)return byId}var first=row.querySelector('td');var name=textFromCell(first);var bucket=tbodyId==='futureRows'?'future':'current';var open=PROJECTS.filter(function(p){return p.status!=='Done'&&p.status!=='Cancelled'&&p.task_bucket===bucket});return open.find(function(p){return String(p.task||'').trim()===name})||open.find(function(p){return name.indexOf(String(p.task||'').trim())>=0})}
function enhance(){var f=e('tracker');try{var d=f.contentWindow.document;if(!d||!d.body)return;var st=d.getElementById('teamTaskEnhanceStyle');if(!st){st=d.createElement('style');st.id='teamTaskEnhanceStyle';st.textContent='.taskLaunch{margin-left:7px;padding:4px 7px!important;font-size:11px!important;border:1px solid #b8c8df!important;color:#175cd3!important;background:#eff6ff!important;border-radius:5px!important;cursor:pointer!important}.taskTitleClickable{cursor:pointer!important}.taskTitleClickable:hover{text-decoration:underline}';d.head.appendChild(st)}['currentRows','futureRows'].forEach(function(tid){var body=d.getElementById(tid);if(!body)return;body.querySelectorAll('tr').forEach(function(row){if(row.dataset.taskEnhanced)return;var p=projectForRow(row,tid);if(!p)return;var td=row.querySelector('td');if(!td)return;row.dataset.taskEnhanced='1';var b=d.createElement('button');b.type='button';b.className='taskLaunch';b.textContent='Tasks';b.title='Open project tasks';b.onclick=function(ev){ev.preventDefault();ev.stopPropagation();openTasks(Number(p.id),p.task)};td.appendChild(b);var hasEditor=td.querySelector('input,textarea,select');if(!hasEditor){td.classList.add('taskTitleClickable');td.onclick=function(ev){if(ev.target&&ev.target.classList&&ev.target.classList.contains('taskLaunch'))return;openTasks(Number(p.id),p.task)}}})})}catch(_){}}
function watchFrame(){Promise.resolve(loadProjectMap()).then(enhance);try{var d=e('tracker').contentWindow.document;new MutationObserver(function(){loadProjectMap().then(enhance)}).observe(d.body,{childList:true,subtree:true})}catch(_){}setInterval(function(){loadProjectMap().then(enhance).catch(function(){})},2000)}
function refreshTracker(){try{var d=e('tracker').contentWindow.document,b=d.getElementById('refreshBtn');if(b)b.click()}catch(_){}setTimeout(function(){loadProjectMap().then(enhance)},450)}
function openTasks(id,title){PID=id;e('projectTitle').textContent=title;e('taskTitle').value='';e('taskDue').value='';e('err').textContent='';e('taskBack').classList.remove('hide');loadTasks()}
function close(){e('taskBack').classList.add('hide');PID=null;TASKS=[];refreshTracker()}
function loadTasks(){if(!PID)return;e('tasks').innerHTML='<div class="empty">Loading tasks...</div>';rpc('tracker_project_tasks',{p_token:T,p_project_id:PID}).then(function(r){TASKS=r||[];render()}).catch(function(x){e('err').textContent=x.message||String(x);e('tasks').innerHTML='<div class="empty">Could not load tasks.</div>'})}
function render(){var total=TASKS.length,done=TASKS.filter(function(t){return t.status==='Done'}).length,p=total?Math.round(done*100/total):0;e('pct').textContent=p+'%';e('fraction').textContent=done+' / '+total;e('summaryText').textContent=total?done+' completed out of '+total:'No tasks yet';e('fill').style.width=p+'%';e('weight').textContent=total?'Each task is worth about '+(100/total).toFixed((total===10||total===20)?0:1)+'% of this project.':'Add the first task to start automatic progress.';if(!total){e('tasks').innerHTML='<div class="empty">No tasks yet. Add the first task above.</div>';return}e('tasks').innerHTML=TASKS.map(function(t){var d=t.status==='Done';return'<div class="row '+(d?'done':'')+'"><input class="check tc" type="checkbox" data-id="'+t.id+'" '+(d?'checked':'')+'><div class="name">'+esc(t.title)+'</div><div class="due">'+esc(fd(t.due_date))+'</div><button class="btn danger td" data-id="'+t.id+'">Delete</button></div>'}).join('');document.querySelectorAll('.tc').forEach(function(c){c.onchange=function(){toggle(Number(this.dataset.id),this.checked,this)}});document.querySelectorAll('.td').forEach(function(b){b.onclick=function(){del(Number(this.dataset.id))}})}
function add(){var t=e('taskTitle').value.trim();if(!t){e('err').textContent='Enter a task name.';return}e('addBtn').disabled=true;e('err').textContent='';rpc('tracker_add_project_task',{p_token:T,p_project_id:PID,p_title:t,p_due_date:e('taskDue').value||null,p_description:null,p_notes:null}).then(function(){e('taskTitle').value='';e('taskDue').value='';refreshTracker();loadTasks()}).catch(function(x){e('err').textContent=x.message||String(x)}).finally(function(){e('addBtn').disabled=false})}
function toggle(id,done,box){box.disabled=true;e('err').textContent='';rpc('tracker_set_project_task_done',{p_token:T,p_id:id,p_done:done}).then(function(){refreshTracker();loadTasks()}).catch(function(x){box.checked=!done;e('err').textContent=x.message||String(x)}).finally(function(){box.disabled=false})}
function del(id){var t=TASKS.find(function(x){return Number(x.id)===id});if(!t||!confirm('Delete task "'+t.title+'"?'))return;rpc('tracker_delete_project_task',{p_token:T,p_id:id}).then(function(){refreshTracker();loadTasks()}).catch(function(x){e('err').textContent=x.message||String(x)})}
if(!T||!MAP[PERSON]){fatal('This task-enabled tracker link is incomplete.');return}
rpc('tracker_me',{p_token:T}).then(function(r){if(!r||!r[0])throw new Error('Invalid tracker access.');OWNER=String(r[0].owner||'').toLowerCase();if(r[0].role!=='founder'&&OWNER!==PERSON)throw new Error('This access link does not match the selected team member.');e('tracker').src=MAP[PERSON]+'?access='+encodeURIComponent(T)+'&v=20260823-tasks';e('tracker').addEventListener('load',watchFrame)}).catch(function(x){fatal(x.message||String(x))});
e('addBtn').onclick=add;e('closeX').onclick=close;e('closeBtn').onclick=close;e('taskTitle').addEventListener('keydown',function(ev){if(ev.key==='Enter'){ev.preventDefault();add()}});
})();
</script>
</body></html>
