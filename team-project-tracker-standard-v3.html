<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>Team Project Tracker</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}iframe{display:block;width:100%;height:100%;border:0;background:#fff}
</style>
</head>
<body>
<iframe id="tracker" title="Project Tracker"></iframe>
<script>
(function(){
  var frame=document.getElementById('tracker');
  var q=new URLSearchParams(location.search);
  q.set('v','20260825-time-weighted-v31');
  frame.src='team-project-tracker-standard-v2-core.html?'+q.toString()+location.hash;

  function band(n){
    if(n>=90)return'Exceptional';
    if(n>=80)return'Excellent';
    if(n>=65)return'Strong';
    if(n>=50)return'Building Strong';
    if(n>=30)return'Developing';
    return'Needs Attention';
  }

  function patch(){
    try{
      var d=frame.contentDocument;
      if(!d)return;
      if(d.title)document.title=d.title;

      var ta=d.getElementById('dailyNote');
      var count=d.getElementById('charCount');
      if(ta){
        ta.removeAttribute('maxlength');
        ta.setAttribute('placeholder','Write all other work completed today. No character limit. Full details are saved.');
        ta.oninput=function(){if(count)count.textContent=this.value.length+' characters • no limit';};
      }
      if(count){
        count.textContent=(ta?ta.value.length:0)+' characters • no limit';
        if(!count.__watching){
          count.__watching=true;
          new MutationObserver(function(){
            var wanted=(ta?ta.value.length:0)+' characters • no limit';
            if(count.textContent!==wanted)count.textContent=wanted;
          }).observe(count,{childList:true,characterData:true,subtree:true});
        }
      }
      var daily=d.querySelector('.dailyhead .note');
      if(daily)daily.textContent='Project movement is captured automatically. Add all other work here. No character limit. Full text is saved; the generated report shows only the key highlights from this extra work.';
      var preview=d.getElementById('reportPreview');
      if(preview && preview.textContent==='No report generated yet.') preview.textContent='Project updates will stay as they are. Other work will be reduced to key highlights when the report is generated.';

      var formula=d.querySelector('.formula > b');
      if(formula)formula.textContent='Overall Score = 75% Project Delivery + 15% Founder Accountability + 10% Work Consistency';
      var weights=d.querySelectorAll('.formula .weight');
      if(weights.length>=3){
        weights[0].querySelector('strong').textContent='75%';
        weights[0].querySelector('b').textContent='Project Delivery';
        weights[0].querySelector('.note').textContent='Big projects carry more weight. A same-day quick job can count as only 0.15 of a normal project. On-time completion earns the best result. Unfinished overdue work gets negative delivery points.';
        weights[1].querySelector('strong').textContent='15%';
        weights[1].querySelector('b').textContent='Founder Accountability';
        weights[1].querySelector('.note').textContent='One report day counts once. Repeated Generate clicks do not add marks. Consistent reporting to the founder earns this part.';
        weights[2].querySelector('strong').textContent='10%';
        weights[2].querySelector('b').textContent='Work Consistency';
        weights[2].querySelector('.note').textContent='Only real progress, completed tasks and genuine blocker updates count. Renaming, due-date edits and repeated value changes do not create a high score.';
      }

      d.querySelectorAll('#perfCards .card .k').forEach(function(k){
        if(k.textContent==='Project Execution')k.textContent='Project Delivery';
        if(k.textContent==='Daily Reports')k.textContent='Founder Accountability';
        if(k.textContent==='Project Activity')k.textContent='Work Consistency';
      });
      var perfHeads=d.querySelectorAll('#performanceView table th');
      perfHeads.forEach(function(h){
        if(h.textContent==='PROJECT')h.textContent='DELIVERY';
        if(h.textContent==='REPORTS')h.textContent='ACCOUNTABILITY';
        if(h.textContent==='ACTIVITY')h.textContent='CONSISTENCY';
      });
      var scoreNote=d.querySelector('#scoresView .note');
      if(scoreNote)scoreNote.textContent='High scores require sustained meaningful delivery. Quick same-day work has very small weight. Late unfinished projects reduce the score. Score bands: 0–29 Needs Attention · 30–49 Developing · 50–64 Building Strong · 65–79 Strong · 80–89 Excellent · 90–100 Exceptional.';

      var pill=d.getElementById('scorePill');
      if(pill){
        var m=pill.textContent.match(/(\d+)\s*\/\s*100/);
        if(m){
          var n=Number(m[1]);
          var old=pill.querySelector('.scoreBandV3');
          if(!old){old=d.createElement('span');old.className='scoreBandV3';old.style.marginLeft='7px';old.style.fontSize='12px';old.style.color='#667085';pill.appendChild(old);}
          old.textContent='· '+band(n);
        }
      }
    }catch(e){}
  }

  frame.addEventListener('load',function(){patch();setTimeout(patch,300);setTimeout(patch,900);});
  setInterval(patch,1200);
})();
</script>
</body>
</html>
